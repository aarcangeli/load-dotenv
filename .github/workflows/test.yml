name: 'build-test'
on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # `dist/index.js` is a special file in Actions.
  # When you reference an action with `uses:` in a workflow,
  # `index.js` is the code that will run.
  # For our project, we generate this file through a build process from other source files.
  # We need to make sure the checked-in `index.js` actually matches what we expect it to be.
  check-dist:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Rebuild the dist/ directory
        run: yarn all

      - name: Compare the expected and actual dist/ directories
        id: diff
        run: |
          if [ "$(git diff --ignore-space-at-eol dist/ | wc -l)" -gt "0" ]; then
            echo "Detected uncommitted changes after build.  See status below:"
            git diff
            exit 1
          fi

      # If index.js was different than expected, upload the expected version as an artifact
      - uses: actions/upload-artifact@v7
        if: ${{ failure() && steps.diff.conclusion == 'failure' }}
        with:
          name: dist
          path: dist/

  test-simple:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./
        with:
          path: .github/test-dir

      - name: Verify Export
        run: |
          if [[ "$TEST_EXPORT" != "foo" ]]; then
            echo 'Expected $TEST_EXPORT set to "foo"'
            exit 1
          fi
          if [[ "$TEST_BASE" != "base" ]]; then
            echo 'Expected $TEST_BASE set to "base"'
            exit 1
          fi
          if [[ "$TEST_UNEXPAND" != '$TEST_EXPORT bar' ]]; then
            echo TEST_UNEXPAND should not be expanded
            echo "Actual: $TEST_UNEXPAND"
            exit 1
          fi

  test-warning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./
        with:
          if-file-not-found: warn

  test-error:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./
        id: test-failure
        continue-on-error: true
        with:
          if-file-not-found: error

      - name: Verify Outcome
        run: |
          echo "Result: ${{ steps.test-failure.outcome }}"
          if [[ "${{ steps.test-failure.outcome }}" != "failure" ]]; then
            echo 'Expected failure'
            exit 1
          fi

  test-quiet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./
        with:
          path: .github/test-dir
          # without log
          quiet: true

  test-multiple-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./
        with:
          path: .github/test-dir
          filenames: |
            .env
            test-override.env

      - name: Verify Export
        run: |
          if [[ "$TEST_EXPORT" != "foo_override" ]]; then
            echo 'Expected $TEST_EXPORT set to "foo_override"'
            exit 1
          fi
          if [[ "$TEST_BASE" != "base" ]]; then
            echo 'Expected $TEST_EXPORT set to "base"'
            exit 1
          fi

  test-expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./
        with:
          path: .github/test-dir
          expand: true
          filenames: test-expand.env

      - name: Verify Export
        run: |
          if [[ "$TEST_EXPORT" != "foo" ]]; then
            echo 'Expected $TEST_EXPORT set to "foo"'
            echo "Actual: $TEST_EXPORT"
            exit 1
          fi
          if [[ "$TEST_EXPAND" != "foo bar" ]]; then
            echo 'Expected $TEST_EXPAND set to "foo bar"'
            echo "Actual: $TEST_EXPAND"
            exit 1
          fi
          if [[ "$TEST_EXPAND_AFTER" != "foo bar" ]]; then
            echo 'Expected $TEST_EXPAND_AFTER set to "foo bar"'
            echo "Actual: $TEST_EXPAND_AFTER"
            exit 1
          fi
          if [[ "$URL" != "https://api-stage.example.com" ]]; then
            echo 'Expected $URL set to "https://api-stage.example.com"'
            echo "Actual: $URL"
            exit 1
          fi
          if [[ "$GET_ASSETS" != "https://api-stage.example.com/assets" ]]; then
            echo 'Expected $GET_ASSETS set to "https://api-stage.example.com/assets"'
            echo "Actual: $GET_ASSETS"
            exit 1
          fi

  test-multiple-files-expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./
        with:
          path: .github/test-dir
          expand: true
          filenames: |
            test-expand.env
            test-override.env

      - name: Verify Export
        run: |
          if [[ "$TEST_EXPORT" != "foo_override" ]]; then
            echo 'Expected $TEST_EXPORT set to "foo_override"'
            echo "Actual: $TEST_EXPORT"
            exit 1
          fi
          if [[ "$TEST_EXPAND" != "foo_override bar" ]]; then
            echo 'Expected $TEST_EXPAND set to "foo_override bar"'
            echo "Actual: $TEST_EXPAND"
            exit 1
          fi
          if [[ "$TEST_EXPAND_AFTER" != "foo_override bar" ]]; then
            echo 'Expected $TEST_EXPAND_AFTER set to "foo_override bar"'
            echo "Actual: $TEST_EXPAND_AFTER"
            exit 1
          fi
          if [[ "$URL" != "https://api-prod.example.com" ]]; then
            echo 'Expected $URL set to "https://api-prod.example.com"'
            echo "Actual: $URL"
            exit 1
          fi
          if [[ "$GET_ASSETS" != "https://api-prod.example.com/assets" ]]; then
            echo 'Expected $GET_ASSETS set to "https://api-prod.example.com/assets"'
            echo "Actual: $GET_ASSETS"
            exit 1
          fi

  test-mask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./
        with:
          path: .github/test-dir
          expand: true
          filenames: test-mask.env
          mask-variables: |
            TEST_SECRET
            TEST_SECRET_EXPANDED

      - name: Verify Export
        run: |
          if [[ "$TEST_SECRET" != "s3cr3t-value" ]]; then
            echo 'Expected $TEST_SECRET to be exported unchanged'
            exit 1
          fi
          if [[ "$TEST_SECRET_EXPANDED" != "s3cr3t-value-expanded" ]]; then
            echo 'Expected $TEST_SECRET_EXPANDED to be exported unchanged'
            exit 1
          fi

      # The masking itself is done by the runner, here we only check that the
      # action asks for it, both for raw and for expanded values.
      - name: Verify mask commands
        env:
          GITHUB_ENV: ${{ runner.temp }}/mask-env
          INPUT_PATH: .github/test-dir
          INPUT_FILENAMES: test-mask.env
          INPUT_EXPAND: 'true'
          INPUT_QUIET: 'true'
          INPUT_MASK-VARIABLES: |
            TEST_SECRET
            TEST_SECRET_EXPANDED
          INPUT_IF-FILE-NOT-FOUND: error
        run: |
          touch "$GITHUB_ENV"
          node dist/index.js | tee "$RUNNER_TEMP/mask-output.txt"
          for expected in 's3cr3t-value' 's3cr3t-value-expanded'; do
            if ! grep -qxF "::add-mask::$expected" "$RUNNER_TEMP/mask-output.txt"; then
              echo "Expected '::add-mask::$expected' in the action output"
              exit 1
            fi
          done

  test-quiet-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify the output with quiet=true
        env:
          GITHUB_ENV: ${{ runner.temp }}/quiet-env
          INPUT_PATH: .github/test-dir
          INPUT_FILENAMES: .env
          INPUT_EXPAND: 'false'
          INPUT_QUIET: 'true'
          INPUT_MASK-VARIABLES: ''
          INPUT_IF-FILE-NOT-FOUND: error
        run: |
          touch "$GITHUB_ENV"
          node dist/index.js > "$RUNNER_TEMP/quiet-output.txt"
          cat "$RUNNER_TEMP/quiet-output.txt"
          if grep -qE '^(Loading |TEST_EXPORT = )' "$RUNNER_TEMP/quiet-output.txt"; then
            echo 'The output must not contain the variables or the loaded files when quiet is true'
            exit 1
          fi
          if ! grep -q '^TEST_EXPORT<<' "$GITHUB_ENV"; then
            echo 'TEST_EXPORT must still be exported when quiet is true'
            exit 1
          fi

      - name: Verify the output with quiet=false
        env:
          GITHUB_ENV: ${{ runner.temp }}/verbose-env
          INPUT_PATH: .github/test-dir
          INPUT_FILENAMES: .env
          INPUT_EXPAND: 'false'
          INPUT_QUIET: 'false'
          INPUT_MASK-VARIABLES: ''
          INPUT_IF-FILE-NOT-FOUND: error
        run: |
          touch "$GITHUB_ENV"
          node dist/index.js > "$RUNNER_TEMP/verbose-output.txt"
          cat "$RUNNER_TEMP/verbose-output.txt"
          for expected in 'Loading ' 'TEST_EXPORT = foo'; do
            if ! grep -qF "$expected" "$RUNNER_TEMP/verbose-output.txt"; then
              echo "Expected '$expected' in the output"
              exit 1
            fi
          done

  test-file-not-found-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify the messages for each if-file-not-found value
        env:
          GITHUB_ENV: ${{ runner.temp }}/not-found-env
          INPUT_PATH: .github/test-dir
          INPUT_FILENAMES: missing.env
          INPUT_EXPAND: 'false'
          INPUT_QUIET: 'false'
          INPUT_MASK-VARIABLES: ''
        run: |
          touch "$GITHUB_ENV"

          env "INPUT_IF-FILE-NOT-FOUND=warn" node dist/index.js > "$RUNNER_TEMP/warn.txt"
          cat "$RUNNER_TEMP/warn.txt"
          grep -q '^::warning::missing.env file not found' "$RUNNER_TEMP/warn.txt" || { echo 'warn must emit a warning'; exit 1; }

          env "INPUT_IF-FILE-NOT-FOUND=ignore" node dist/index.js > "$RUNNER_TEMP/ignore.txt"
          cat "$RUNNER_TEMP/ignore.txt"
          if grep -qE '^::(warning|error)::' "$RUNNER_TEMP/ignore.txt"; then
            echo 'ignore must not emit warnings or errors'
            exit 1
          fi

          if env "INPUT_IF-FILE-NOT-FOUND=error" node dist/index.js > "$RUNNER_TEMP/error.txt"; then
            echo 'error must fail the action'
            exit 1
          fi
          cat "$RUNNER_TEMP/error.txt"
          grep -q '^::error::missing.env file not found' "$RUNNER_TEMP/error.txt" || { echo 'error must emit an error'; exit 1; }

  test-ignore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./
        with:
          path: .github/test-dir
          filenames: missing.env
          if-file-not-found: ignore

  test-missing-file-among-others:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # With warn and ignore the missing file is skipped and the others are loaded
      - uses: ./
        with:
          path: .github/test-dir
          if-file-not-found: warn
          filenames: |
            missing.env
            test-override.env

      - name: Verify Export
        run: |
          if [[ "$TEST_EXPORT" != "foo_override" ]]; then
            echo 'Expected $TEST_EXPORT set to "foo_override"'
            echo "Actual: $TEST_EXPORT"
            exit 1
          fi

  test-missing-file-error-exports-nothing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./
        id: load
        continue-on-error: true
        with:
          path: .github/test-dir
          if-file-not-found: error
          filenames: |
            test-override.env
            missing.env

      - name: Verify Outcome
        run: |
          if [[ "${{ steps.load.outcome }}" != "failure" ]]; then
            echo 'Expected failure'
            exit 1
          fi
          # The action stops before exporting anything
          if [[ -n "${TEST_EXPORT+x}" ]]; then
            echo 'Expected $TEST_EXPORT to be unset'
            echo "Actual: $TEST_EXPORT"
            exit 1
          fi

  test-subdirectory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./
        with:
          path: .github/test-dir
          filenames: sub/sub.env

      - name: Verify Export
        run: |
          if [[ "$IN_SUB" != "sub" ]]; then
            echo 'Expected $IN_SUB set to "sub"'
            echo "Actual: $IN_SUB"
            exit 1
          fi

  # Documents how the dotenv syntax is parsed
  test-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./
        with:
          path: .github/test-dir
          filenames: syntax.env

      - name: Verify Export
        run: |
          fail=0
          check() {
            if [[ "${!1}" != "$2" ]]; then
              echo "Expected \$$1 set to '$2'"
              echo "Actual: '${!1}'"
              fail=1
            fi
          }
          check PLAIN 'value'
          check SPACED 'spaced value'
          check SINGLE 'single quoted # not a comment'
          check DOUBLE 'double quoted # not a comment'
          check INLINE 'before'
          check WITH_EQUALS 'a=b=c'
          check EXPORTED 'exported'
          check MULTILINE $'line1\nline2'
          check NEWLINE_ESCAPE $'a\nb'
          check URL 'https://example.com/path?x=1&y=2'
          check BACKTICK 'back tick'
          # An empty value is exported as an empty variable
          if [[ -z "${EMPTY+x}" || -n "$EMPTY" ]]; then
            echo 'Expected $EMPTY set and empty'
            fail=1
          fi
          exit $fail

  test-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./
        continue-on-error: true
        id: test-cycle
        with:
          path: .github/test-dir
          expand: true
          filenames: |
            test-cycle.env

      - name: Verify Outcome
        run: |
          echo "Result: ${{ steps.test-cycle.outcome }}"
          if [[ "${{ steps.test-cycle.outcome }}" != "failure" ]]; then
            echo 'Expected failure'
            exit 1
          fi
